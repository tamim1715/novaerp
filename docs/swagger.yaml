basePath: /api/v1
definitions:
  attendance.CheckInRequest:
    properties:
      employeeId:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      notes:
        example: Arrived at main office
        type: string
    required:
    - employeeId
    type: object
  attendance.CheckOutRequest:
    properties:
      employeeId:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      notes:
        example: Completed shift
        type: string
    required:
    - employeeId
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  department.CreateDepartmentRequest:
    properties:
      code:
        example: "1234"
        maxLength: 20
        type: string
      description:
        example: This is a hr department
        type: string
      name:
        example: hr
        maxLength: 100
        type: string
    required:
    - code
    - name
    type: object
  department.UpdateDepartmentRequest:
    properties:
      code:
        example: "1234"
        maxLength: 20
        type: string
      description:
        example: This is an new hr department
        type: string
      name:
        example: hr
        maxLength: 100
        type: string
    required:
    - code
    - name
    type: object
  employee.CreateEmployeeRequest:
    properties:
      department_id:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      designation:
        example: assistant manager
        type: string
      email:
        example: shahadat@gmail.com
        type: string
      firstName:
        example: Shahadath Hossain
        maxLength: 100
        type: string
      joiningDate:
        example: "2006-01-02"
        type: string
      lastName:
        example: Tamim
        type: string
      phone:
        example: "123456"
        type: string
      salary:
        example: 50000
        type: number
      status:
        example: active
        type: string
    required:
    - department_id
    - email
    - firstName
    type: object
  employee.UpdateEmployeeRequest:
    properties:
      department_id:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      designation:
        example: assistant manager
        type: string
      email:
        example: shahadat@gmail.com
        type: string
      firstName:
        example: Shahadath Hossain
        type: string
      joiningDate:
        example: "2006-01-02"
        type: string
      lastName:
        example: Tamim
        type: string
      phone:
        example: "123456"
        type: string
      salary:
        example: 50000
        type: number
      status:
        example: active
        type: string
    type: object
  leaverequest.CreateLeaveRequest:
    properties:
      employeeId:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      endDate:
        description: YYYY-MM-DD
        example: "2026-08-12"
        type: string
      leaveTypeId:
        example: 8a393bbd-9790-4045-853e-26a2c732ee09
        type: string
      reason:
        example: Family vacation
        type: string
      startDate:
        description: YYYY-MM-DD
        example: "2026-08-10"
        type: string
    required:
    - employeeId
    - endDate
    - leaveTypeId
    - startDate
    type: object
  leaverequest.UpdateLeaveStatusRequest:
    properties:
      approvedBy:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      remarks:
        example: Approved by manager
        type: string
      status:
        enum:
        - APPROVED
        - REJECTED
        example: APPROVED
        type: string
    required:
    - status
    type: object
  leavetype.CreateLeaveTypeRequest:
    properties:
      code:
        example: CL
        maxLength: 20
        type: string
      description:
        example: Standard annual casual leave
        type: string
      isPaid:
        example: true
        type: boolean
      maxDaysPerYear:
        example: 14
        minimum: 1
        type: integer
      name:
        example: Casual Leave
        maxLength: 100
        type: string
    required:
    - code
    - maxDaysPerYear
    - name
    type: object
  payroll.CreatePayrollPeriodRequest:
    properties:
      month:
        example: 8
        maximum: 12
        minimum: 1
        type: integer
      year:
        example: 2026
        minimum: 2020
        type: integer
    required:
    - month
    - year
    type: object
  payroll.ProcessPayrollRequest:
    properties:
      allowancesDefault:
        description: Standard bonus/allowance per employee
        example: 200
        type: number
      deductionsDefault:
        description: Standard tax/insurance deduction per employee
        example: 50
        type: number
    type: object
  product.CreateProductRequest:
    properties:
      category:
        example: Electronics
        type: string
      description:
        example: High performance laptop
        type: string
      minStockLevel:
        example: 5
        type: integer
      name:
        example: Laptop Dell XPS 15
        maxLength: 150
        type: string
      sku:
        example: PRD-1001
        maxLength: 50
        type: string
      unit:
        example: pcs
        type: string
      unitPrice:
        example: 1499.99
        type: number
    required:
    - name
    - sku
    type: object
  product.UpdateProductRequest:
    properties:
      category:
        example: Electronics
        type: string
      description:
        example: High performance laptop
        type: string
      minStockLevel:
        example: 5
        type: integer
      name:
        example: Laptop Dell XPS 15
        type: string
      sku:
        example: PRD-1001
        type: string
      unit:
        example: pcs
        type: string
      unitPrice:
        example: 1499.99
        type: number
    type: object
  response.APIResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  stock.AdjustStockRequest:
    properties:
      productId:
        example: 8a393bbd-9790-4045-853e-26a2c732ee09
        type: string
      quantityDelta:
        description: Positive to add, negative to reduce
        example: 50
        type: integer
      warehouseId:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
    required:
    - productId
    - quantityDelta
    - warehouseId
    type: object
  user.CreateUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  user.UpdateUserRequest:
    properties:
      email:
        type: string
      isActive:
        type: boolean
      username:
        type: string
    type: object
  warehouse.CreateWarehouseRequest:
    properties:
      code:
        example: WH-001
        maxLength: 30
        type: string
      location:
        example: Building A, Industrial Area
        type: string
      name:
        example: Main Warehouse
        maxLength: 100
        type: string
    required:
    - code
    - name
    type: object
  warehouse.UpdateWarehouseRequest:
    properties:
      code:
        example: WH-001
        type: string
      isActive:
        example: true
        type: boolean
      location:
        example: Building A, Industrial Area
        type: string
      name:
        example: Main Warehouse Updated
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Nova ERP REST API
  title: Nova ERP API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT bearer token
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: User Login
      tags:
      - Auth
  /departments:
    get:
      consumes:
      - application/json
      description: Get all departments
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Size
        in: query
        name: size
        type: integer
      - description: Search
        in: query
        name: search
        type: string
      - description: Sort By
        in: query
        name: sortBy
        type: string
      - description: asc|desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get Departments
      tags:
      - Department
    post:
      consumes:
      - application/json
      description: Create a new department
      parameters:
      - description: Department
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/department.CreateDepartmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Create Department
      tags:
      - Department
  /departments/{id}:
    delete:
      description: Soft delete department
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Delete Department
      tags:
      - Department
    get:
      description: Get department by ID
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get Department
      tags:
      - Department
    put:
      consumes:
      - application/json
      description: Update department
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: string
      - description: Department
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/department.UpdateDepartmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Update Department
      tags:
      - Department
  /employees:
    get:
      consumes:
      - application/json
      description: Get all employees
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Size
        in: query
        name: size
        type: integer
      - description: Search
        in: query
        name: search
        type: string
      - description: Sort By
        in: query
        name: sortBy
        type: string
      - description: asc|desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get Employees
      tags:
      - Employee
    post:
      consumes:
      - application/json
      description: Create a new employee
      parameters:
      - description: Employee
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/employee.CreateEmployeeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Create Employee
      tags:
      - Employee
  /employees/{id}:
    delete:
      description: Soft delete employee
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Delete Employee
      tags:
      - Employee
    get:
      description: Get employee by ID
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get Employee
      tags:
      - Employee
    put:
      consumes:
      - application/json
      description: Update employee
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: string
      - description: Employee
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/employee.UpdateEmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Update Employee
      tags:
      - Employee
  /hr/attendances:
    get:
      description: Retrieve daily attendance records with pagination
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: List attendance logs
      tags:
      - Attendance
  /hr/attendances/check-in:
    post:
      consumes:
      - application/json
      description: Clock in for daily work shift
      parameters:
      - description: Check-in payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/attendance.CheckInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Record employee check-in
      tags:
      - Attendance
  /hr/attendances/check-out:
    post:
      consumes:
      - application/json
      description: Clock out for daily work shift and calculate hours
      parameters:
      - description: Check-out payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/attendance.CheckOutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Record employee check-out
      tags:
      - Attendance
  /hr/leaves/requests:
    post:
      consumes:
      - application/json
      description: Submit a leave application for an employee
      parameters:
      - description: Leave application details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/leaverequest.CreateLeaveRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Apply for leave
      tags:
      - Leave Requests
  /hr/leaves/requests/{id}/status:
    put:
      consumes:
      - application/json
      description: Update leave status to APPROVED or REJECTED
      parameters:
      - description: Leave Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Approval details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/leaverequest.UpdateLeaveStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Approve or reject leave request
      tags:
      - Leave Requests
  /hr/leaves/types:
    get:
      description: Retrieve leave policy categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: List leave types
      tags:
      - Leave Types
    post:
      consumes:
      - application/json
      description: Define a new leave policy category
      parameters:
      - description: Leave type details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/leavetype.CreateLeaveTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Create a leave type
      tags:
      - Leave Types
  /hr/payrolls:
    post:
      consumes:
      - application/json
      description: Initialize a monthly payroll period batch
      parameters:
      - description: Payroll period month/year
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payroll.CreatePayrollPeriodRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Create a payroll period
      tags:
      - Payroll
  /hr/payrolls/{id}/payslips:
    get:
      description: Retrieve generated payslips for a payroll period
      parameters:
      - description: Payroll Period ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: List payslips for period
      tags:
      - Payroll
  /hr/payrolls/{id}/process:
    post:
      consumes:
      - application/json
      description: Calculate salary slips for all active employees for the period
      parameters:
      - description: Payroll Period ID
        in: path
        name: id
        required: true
        type: string
      - description: Default allowances and deductions
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payroll.ProcessPayrollRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Process monthly payroll
      tags:
      - Payroll
  /inventories/products:
    get:
      description: Retrieve products with pagination, sorting, and search
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 10)
        in: query
        name: limit
        type: integer
      - description: Search query
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: List all products
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Add a new product to inventory
      parameters:
      - description: Product creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/product.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Create a product
      tags:
      - Products
  /inventories/products/{id}:
    delete:
      description: Remove a product by ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Delete product
      tags:
      - Products
    get:
      description: Retrieve details of a specific product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get product by ID
      tags:
      - Products
    put:
      consumes:
      - application/json
      description: Update product details by ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Product update fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/product.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Update product
      tags:
      - Products
  /inventories/stocks:
    get:
      description: Retrieve inventory stock levels across warehouses
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: List all stock entries
      tags:
      - Stocks
  /inventories/stocks/adjust:
