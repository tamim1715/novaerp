basePath: /api/v1
definitions:
  department.CreateDepartmentRequest:
    properties:
      code:
        example: "1234"
        maxLength: 20
        type: string
      description:
        example: This is a hr department
        type: string
      name:
        example: hr
        maxLength: 100
        type: string
    required:
    - code
    - name
    type: object
  department.UpdateDepartmentRequest:
    properties:
      code:
        example: "1234"
        maxLength: 20
        type: string
      description:
        example: This is an new hr department
        type: string
      name:
        example: hr
        maxLength: 100
        type: string
    required:
    - code
    - name
    type: object
  employee.CreateEmployeeRequest:
    properties:
      department_id:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      designation:
        example: assistant manager
        type: string
      email:
        example: shahadat@gmail.com
        type: string
      firstName:
        example: Shahadath Hossain
        maxLength: 100
        type: string
      joiningDate:
        example: "2006-01-02"
        type: string
      lastName:
        example: Tamim
        type: string
      phone:
        example: "123456"
        type: string
      salary:
        example: 50000
        type: number
      status:
        example: active
        type: string
    required:
    - department_id
    - email
    - firstName
    type: object
  employee.UpdateEmployeeRequest:
    properties:
      department_id:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      designation:
        example: assistant manager
        type: string
      email:
        example: shahadat@gmail.com
        type: string
      firstName:
        example: Shahadath Hossain
        type: string
      joiningDate:
        example: "2006-01-02"
        type: string
      lastName:
        example: Tamim
        type: string
      phone:
        example: "123456"
        type: string
      salary:
        example: 50000
        type: number
      status:
        example: active
        type: string
    type: object
  response.APIResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Nova ERP REST API
  title: Nova ERP API
  version: "1.0"
paths:
  /departments:
    get:
      consumes:
      - application/json
      description: Get all departments
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Size
        in: query
        name: size
        type: integer
      - description: Search
        in: query
        name: search
        type: string
      - description: Sort By
        in: query
        name: sortBy
        type: string
      - description: asc|desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get Departments
      tags:
      - Department
    post:
      consumes:
      - application/json
      description: Create a new department
      parameters:
      - description: Department
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/department.CreateDepartmentRequest'
      produces:
