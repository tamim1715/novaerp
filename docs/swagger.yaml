basePath: /api/v1
definitions:
  account.AccountResponse:
    properties:
      code:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      isSystem:
        type: boolean
      name:
        type: string
      normalBalance:
        type: string
      parentId:
        type: string
      type:
        type: string
      updatedAt:
        type: string
    type: object
  account.AccountTreeResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/account.AccountTreeResponse'
        type: array
      code:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      isSystem:
        type: boolean
      name:
        type: string
      normalBalance:
        type: string
      parentId:
        type: string
      type:
        type: string
      updatedAt:
        type: string
    type: object
  account.CreateAccountRequest:
    properties:
      code:
        maxLength: 50
        minLength: 2
        type: string
      currency:
        type: string
      description:
        maxLength: 255
        type: string
      isActive:
        type: boolean
      name:
        maxLength: 150
        minLength: 2
        type: string
      normalBalance:
        enum:
        - DEBIT
        - CREDIT
        type: string
      parentId:
        type: string
      type:
        enum:
        - ASSET
        - LIABILITY
        - EQUITY
        - REVENUE
        - EXPENSE
        type: string
    required:
    - code
    - name
    - type
    type: object
  account.UpdateAccountRequest:
    properties:
      currency:
        type: string
      description:
        maxLength: 255
        type: string
      isActive:
        type: boolean
      name:
        maxLength: 150
        minLength: 2
        type: string
      parentId:
        type: string
    type: object
  attendance.CheckInRequest:
    properties:
      employeeId:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      notes:
        example: Arrived at main office
        type: string
    required:
    - employeeId
    type: object
  attendance.CheckOutRequest:
    properties:
      employeeId:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      notes:
        example: Completed shift
        type: string
    required:
    - employeeId
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: admin@novaerp.com
        type: string
      password:
        example: secret123
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  auth.LogoutRequest:
    properties:
      refreshToken:
        example: 6f4a8b...
        type: string
    required:
    - refreshToken
    type: object
  auth.RefreshTokenRequest:
    properties:
      refreshToken:
        example: 6f4a8b...
        type: string
    required:
    - refreshToken
    type: object
  department.CreateDepartmentRequest:
    properties:
      code:
        example: "1234"
        maxLength: 20
        type: string
      description:
        example: This is a hr department
        type: string
      name:
        example: hr
        maxLength: 100
        type: string
    required:
    - code
    - name
    type: object
  department.UpdateDepartmentRequest:
    properties:
      code:
        example: "1234"
        maxLength: 20
        type: string
      description:
        example: This is an new hr department
        type: string
      name:
        example: hr
        maxLength: 100
        type: string
    required:
    - code
    - name
    type: object
  employee.CreateEmployeeRequest:
    properties:
      department_id:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      designation:
        example: assistant manager
        type: string
      email:
        example: shahadat@gmail.com
        type: string
      firstName:
        example: Shahadath Hossain
        maxLength: 100
        type: string
      joiningDate:
        example: "2006-01-02"
        type: string
      lastName:
        example: Tamim
        type: string
      phone:
        example: "123456"
        type: string
      salary:
        example: 50000
        type: number
      status:
        example: active
        type: string
    required:
    - department_id
    - email
    - firstName
    type: object
  employee.UpdateEmployeeRequest:
    properties:
      department_id:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      designation:
        example: assistant manager
        type: string
      email:
        example: shahadat@gmail.com
        type: string
      firstName:
        example: Shahadath Hossain
        type: string
      joiningDate:
        example: "2006-01-02"
        type: string
      lastName:
        example: Tamim
        type: string
      phone:
        example: "123456"
        type: string
      salary:
        example: 50000
        type: number
      status:
        example: active
        type: string
    type: object
  journal.CreateJournalEntryRequest:
    properties:
      autoPost:
        type: boolean
      description:
        maxLength: 255
        minLength: 3
        type: string
      entryDate:
        type: string
      lines:
        items:
          $ref: '#/definitions/journal.CreateJournalLineRequest'
        minItems: 2
        type: array
      reference:
        maxLength: 100
        type: string
      sourceId:
        type: string
      sourceType:
        enum:
        - MANUAL
        - PAYROLL
        - INVOICE
        - PAYMENT
        - STOCK_ADJUSTMENT
        type: string
    required:
    - description
    - entryDate
    - lines
    type: object
  journal.CreateJournalLineRequest:
    properties:
      accountId:
        type: string
      credit:
        minimum: 0
        type: number
      debit:
        minimum: 0
        type: number
      description:
        maxLength: 255
        type: string
      partnerId:
        type: string
      partnerType:
        enum:
        - NONE
        - CUSTOMER
        - VENDOR
        - EMPLOYEE
        type: string
    required:
    - accountId
    type: object
  journal.JournalEntryLineResponse:
    properties:
      account:
        $ref: '#/definitions/account.AccountResponse'
      accountCode:
        type: string
      accountId:
        type: string
      accountName:
        type: string
      accountType:
        type: string
      credit:
        type: number
      debit:
        type: number
      description:
        type: string
      id:
        type: string
      partnerId:
        type: string
      partnerType:
        type: string
    type: object
  journal.JournalEntryResponse:
    properties:
      createdAt:
        type: string
      description:
        type: string
      entryDate:
        type: string
      entryNumber:
        type: string
      id:
        type: string
      lines:
        items:
          $ref: '#/definitions/journal.JournalEntryLineResponse'
        type: array
      periodId:
        type: string
      postedBy:
        type: string
      postingDate:
        type: string
      reference:
        type: string
      reversalOfId:
        type: string
      sourceId:
        type: string
      sourceType:
        type: string
      status:
        type: string
      totalCredit:
        type: number
      totalDebit:
        type: number
      updatedAt:
        type: string
      voidReason:
        type: string
    type: object
  journal.VoidJournalEntryRequest:
    properties:
      reason:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - reason
    type: object
  leaverequest.CreateLeaveRequest:
    properties:
      employeeId:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      endDate:
        description: YYYY-MM-DD
        example: "2026-08-12"
        type: string
      leaveTypeId:
        example: 8a393bbd-9790-4045-853e-26a2c732ee09
        type: string
      reason:
        example: Family vacation
        type: string
      startDate:
        description: YYYY-MM-DD
        example: "2026-08-10"
        type: string
    required:
    - employeeId
    - endDate
    - leaveTypeId
    - startDate
    type: object
  leaverequest.UpdateLeaveStatusRequest:
    properties:
      approvedBy:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      remarks:
        example: Approved by manager
        type: string
      status:
        enum:
        - APPROVED
        - REJECTED
        example: APPROVED
        type: string
    required:
    - status
    type: object
  leavetype.CreateLeaveTypeRequest:
    properties:
      code:
        example: CL
        maxLength: 20
        type: string
      description:
        example: Standard annual casual leave
        type: string
      isPaid:
        example: true
        type: boolean
      maxDaysPerYear:
        example: 14
        minimum: 1
        type: integer
      name:
        example: Casual Leave
        maxLength: 100
        type: string
    required:
    - code
    - maxDaysPerYear
    - name
    type: object
  pagination.PageResponse:
    properties:
      data: {}
      page:
        type: integer
      size:
        type: integer
      totalItems:
        type: integer
      totalPages:
        type: integer
    type: object
  payroll.CreatePayrollPeriodRequest:
    properties:
      month:
        example: 8
        maximum: 12
        minimum: 1
        type: integer
      year:
        example: 2026
        minimum: 2020
        type: integer
    required:
    - month
    - year
    type: object
  payroll.ProcessPayrollRequest:
    properties:
      allowancesDefault:
        description: Standard bonus/allowance per employee
        example: 200
        type: number
      deductionsDefault:
        description: Standard tax/insurance deduction per employee
        example: 50
        type: number
    type: object
  period.AccountingPeriodResponse:
    properties:
      createdAt:
        type: string
      endDate:
        type: string
      fiscalYearId:
        type: string
      id:
        type: string
      name:
        type: string
      periodNumber:
        type: integer
      startDate:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  period.CreateFiscalYearRequest:
    properties:
      autoCreatePeriods:
        description: if true, creates 12 monthly accounting periods automatically
        type: boolean
      endDate:
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
      startDate:
        type: string
    required:
    - endDate
    - name
    - startDate
    type: object
  period.FiscalYearResponse:
    properties:
      createdAt:
        type: string
      endDate:
        type: string
      id:
        type: string
      isClosed:
        type: boolean
      name:
        type: string
      periods:
        items:
          $ref: '#/definitions/period.AccountingPeriodResponse'
        type: array
      startDate:
        type: string
      updatedAt:
        type: string
    type: object
  product.CreateProductRequest:
    properties:
      category:
        example: Electronics
        type: string
      description:
        example: High performance laptop
        type: string
      minStockLevel:
        example: 5
        type: integer
      name:
        example: Laptop Dell XPS 15
        maxLength: 150
        type: string
      sku:
        example: PRD-1001
        maxLength: 50
        type: string
      unit:
        example: pcs
        type: string
      unitPrice:
        example: 1499.99
        type: number
    required:
    - name
    - sku
    type: object
  product.UpdateProductRequest:
    properties:
      category:
        example: Electronics
        type: string
      description:
        example: High performance laptop
        type: string
      minStockLevel:
        example: 5
        type: integer
      name:
        example: Laptop Dell XPS 15
        type: string
      sku:
        example: PRD-1001
        type: string
      unit:
        example: pcs
        type: string
      unitPrice:
        example: 1499.99
        type: number
    type: object
  report.BalanceSheetResponse:
    properties:
      asOfDate:
        type: string
      currentAssets:
        $ref: '#/definitions/report.BalanceSheetSection'
      currentLiabilities:
        $ref: '#/definitions/report.BalanceSheetSection'
      currentPeriodNetIncome:
        type: number
      equity:
        $ref: '#/definitions/report.BalanceSheetSection'
      isBalanced:
        description: TotalAssets == TotalLiabilitiesAndEquity
        type: boolean
      longTermLiabilities:
        $ref: '#/definitions/report.BalanceSheetSection'
      nonCurrentAssets:
        $ref: '#/definitions/report.BalanceSheetSection'
      totalAssets:
        type: number
      totalEquity:
        type: number
      totalLiabilities:
        type: number
      totalLiabilitiesAndEquity:
        type: number
    type: object
  report.BalanceSheetSection:
    properties:
      category:
        type: string
      items:
        items:
          $ref: '#/definitions/report.StatementLineItem'
        type: array
      subtotal:
        type: number
    type: object
  report.GeneralLedgerAccountReport:
    properties:
      accountCode:
        type: string
      accountId:
        type: string
      accountName:
        type: string
      accountType:
        type: string
      closingBalance:
        type: number
      normalBalance:
        type: string
      openingBalance:
        type: number
      periodCreditTotal:
        type: number
      periodDebitTotal:
        type: number
      transactions:
        items:
          $ref: '#/definitions/report.LedgerTransactionItem'
        type: array
    type: object
  report.GeneralLedgerResponse:
    properties:
      accounts:
        items:
          $ref: '#/definitions/report.GeneralLedgerAccountReport'
        type: array
      endDate:
        type: string
      startDate:
        type: string
    type: object
  report.LedgerTransactionItem:
    properties:
      credit:
        type: number
      date:
        type: string
      debit:
        type: number
      description:
        type: string
      entryNumber:
        type: string
      journalEntryId:
        type: string
      reference:
        type: string
      runningBalance:
        type: number
    type: object
  report.ProfitAndLossResponse:
    properties:
      costOfGoodsSold:
        items:
          $ref: '#/definitions/report.StatementLineItem'
        type: array
      endDate:
        type: string
      grossProfit:
        type: number
      netIncome:
        description: GrossProfit - OperatingExpenses
        type: number
      operatingExpenses:
        items:
          $ref: '#/definitions/report.StatementLineItem'
        type: array
      operatingRevenues:
        items:
          $ref: '#/definitions/report.StatementLineItem'
        type: array
      startDate:
        type: string
      totalCogs:
        type: number
      totalOperatingExpenses:
        type: number
      totalRevenue:
        type: number
    type: object
  report.StatementLineItem:
    properties:
      accountCode:
        type: string
      accountName:
        type: string
      amount:
        type: number
    type: object
  report.TrialBalanceItem:
    properties:
      accountCode:
        type: string
      accountId:
        type: string
      accountName:
        type: string
      accountType:
        type: string
      creditTurnover:
        type: number
      debitTurnover:
        type: number
      netCredit:
        type: number
      netDebit:
        type: number
      normalBalance:
        type: string
    type: object
  report.TrialBalanceResponse:
    properties:
      asOfDate:
        type: string
      difference:
        type: number
      isBalanced:
        type: boolean
      items:
        items:
          $ref: '#/definitions/report.TrialBalanceItem'
        type: array
      totalCredits:
        type: number
      totalDebits:
        type: number
    type: object
  response.APIResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  stock.AdjustStockRequest:
    properties:
      productId:
        example: 8a393bbd-9790-4045-853e-26a2c732ee09
        type: string
      quantityDelta:
        description: Positive to add, negative to reduce
        example: 50
        type: integer
      warehouseId:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
    required:
    - productId
    - quantityDelta
    - warehouseId
    type: object
  user.CreateUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      role:
        example: admin
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  user.UpdateUserRequest:
    properties:
      email:
        type: string
      isActive:
        type: boolean
      role:
        type: string
      username:
        type: string
    type: object
  warehouse.CreateWarehouseRequest:
    properties:
      code:
        example: WH-001
        maxLength: 30
        type: string
      location:
        example: Building A, Industrial Area
        type: string
      name:
        example: Main Warehouse
        maxLength: 100
        type: string
    required:
    - code
    - name
    type: object
  warehouse.UpdateWarehouseRequest:
    properties:
      code:
        example: WH-001
        type: string
      isActive:
        example: true
        type: boolean
      location:
        example: Building A, Industrial Area
        type: string
      name:
        example: Main Warehouse Updated
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Nova ERP REST API with RS256 JWT Authentication
  title: Nova ERP API
  version: "1.0"
paths:
  /accounting/accounts:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of accounts with optional type filter
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: size
        type: integer
      - default: code
        description: Sort by field
        in: query
        name: sortBy
        type: string
      - default: asc
        description: Sort order (asc/desc)
        in: query
        name: order
        type: string
      - description: Filter by Account Type (ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE)
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Accounts retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/pagination.PageResponse'
                  - properties:
                      data:
                        items:
                          $ref: '#/definitions/account.AccountResponse'
                        type: array
                    type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: List Chart of Accounts
      tags:
      - Accounting - Accounts
    post:
      consumes:
      - application/json
      description: Add a new account to the General Ledger Chart of Accounts (COA)
      parameters:
      - description: Account Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/account.AccountResponse'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Create Chart of Accounts entry
      tags:
      - Accounting - Accounts
  /accounting/accounts/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an account (non-system accounts with no children only)
      parameters:
      - description: Account UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Account deleted successfully
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad request / System account
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete Account
      tags:
      - Accounting - Accounts
    get:
      consumes:
      - application/json
      description: Retrieve a single Chart of Accounts record by its UUID
      parameters:
      - description: Account UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Account retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/account.AccountResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Account by ID
      tags:
      - Accounting - Accounts
    put:
      consumes:
      - application/json
      description: Update account attributes (name, description, active status)
      parameters:
      - description: Account UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Account updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/account.AccountResponse'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update Account
      tags:
      - Accounting - Accounts
  /accounting/accounts/seed:
    post:
      consumes:
      - application/json
      description: Pre-populates standard enterprise GAAP / IFRS accounts if empty
      produces:
      - application/json
      responses:
        "200":
          description: Standard Chart of Accounts seeded successfully
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Seed Standard Chart of Accounts
      tags:
      - Accounting - Accounts
  /accounting/accounts/tree:
    get:
      consumes:
      - application/json
      description: Retrieve parent-child nested tree structure of all accounts
      produces:
      - application/json
      responses:
        "200":
          description: Account tree hierarchy retrieved
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/account.AccountTreeResponse'
