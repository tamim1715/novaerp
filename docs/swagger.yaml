basePath: /api/v1
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  department.CreateDepartmentRequest:
    properties:
      code:
        example: "1234"
        maxLength: 20
        type: string
      description:
        example: This is a hr department
        type: string
      name:
        example: hr
        maxLength: 100
        type: string
    required:
    - code
    - name
    type: object
  department.UpdateDepartmentRequest:
    properties:
      code:
        example: "1234"
        maxLength: 20
        type: string
      description:
        example: This is an new hr department
        type: string
      name:
        example: hr
        maxLength: 100
        type: string
    required:
    - code
    - name
    type: object
  employee.CreateEmployeeRequest:
    properties:
      department_id:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      designation:
        example: assistant manager
        type: string
      email:
        example: shahadat@gmail.com
        type: string
      firstName:
        example: Shahadath Hossain
        maxLength: 100
        type: string
      joiningDate:
        example: "2006-01-02"
        type: string
      lastName:
        example: Tamim
        type: string
      phone:
        example: "123456"
        type: string
      salary:
        example: 50000
        type: number
      status:
        example: active
        type: string
    required:
    - department_id
    - email
    - firstName
    type: object
  employee.UpdateEmployeeRequest:
    properties:
      department_id:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
      designation:
        example: assistant manager
        type: string
      email:
        example: shahadat@gmail.com
        type: string
      firstName:
        example: Shahadath Hossain
        type: string
      joiningDate:
        example: "2006-01-02"
        type: string
      lastName:
        example: Tamim
        type: string
      phone:
        example: "123456"
        type: string
      salary:
        example: 50000
        type: number
      status:
        example: active
        type: string
    type: object
  inventory.AdjustStockRequest:
    properties:
      productId:
        example: 8a393bbd-9790-4045-853e-26a2c732ee09
        type: string
      quantityDelta:
        description: Positive to add, negative to reduce
        example: 50
        type: integer
      warehouseId:
        example: 3f393bbd-9790-4045-853e-26a2c732ee06
        type: string
    required:
    - productId
    - quantityDelta
    - warehouseId
    type: object
  inventory.CreateProductRequest:
    properties:
      category:
        example: Electronics
        type: string
      description:
        example: High performance laptop
        type: string
      minStockLevel:
        example: 5
        type: integer
      name:
        example: Laptop Dell XPS 15
        maxLength: 150
        type: string
      sku:
        example: PRD-1001
        maxLength: 50
        type: string
      unit:
        example: pcs
        type: string
      unitPrice:
        example: 1499.99
        type: number
    required:
    - name
    - sku
    type: object
  inventory.CreateWarehouseRequest:
    properties:
      code:
        example: WH-001
        maxLength: 30
        type: string
      location:
        example: Building A, Industrial Area
        type: string
      name:
        example: Main Warehouse
        maxLength: 100
        type: string
    required:
    - code
    - name
    type: object
  inventory.UpdateProductRequest:
    properties:
      category:
        example: Electronics
        type: string
      description:
        example: High performance laptop
        type: string
      minStockLevel:
        example: 5
        type: integer
      name:
        example: Laptop Dell XPS 15
        type: string
      sku:
        example: PRD-1001
        type: string
      unit:
        example: pcs
        type: string
      unitPrice:
        example: 1499.99
        type: number
    type: object
  inventory.UpdateWarehouseRequest:
    properties:
      code:
        example: WH-001
        type: string
      isActive:
        example: true
        type: boolean
      location:
        example: Building A, Industrial Area
        type: string
      name:
        example: Main Warehouse Updated
        type: string
    type: object
  response.APIResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  user.CreateUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  user.UpdateUserRequest:
    properties:
      email:
        type: string
      isActive:
        type: boolean
      username:
        type: string
    type: object
